[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p2p-module-calling"
version = "0.1.0"
description = "Peer-to-peer remote PyTorch module execution with autograd support"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "torch",
    "hivemind @ git+https://github.com/learning-at-home/hivemind.git@master",
    "grpcio>=1.56.0",
    "grpcio-tools>=1.56.0",
    "betterproto[compiler]>=2.0.0b6",
    "safetensors>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["p2p_module_calling*"]

[tool.pytest.ini_options]
testpaths = ["tests"]